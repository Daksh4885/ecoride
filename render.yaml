services:
  - type: web
    name: ecoride-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_MAPS_KEY
        sync: false
      - key: WHATSAPP_API_URL
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
